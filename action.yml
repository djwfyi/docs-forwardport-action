name: 'Docs Forwardport Action'
description: 'Forwardports changes from versioned documentation folders to main folders in Docusaurus projects'
author: 'loft-sh'

inputs:
  github_token:
    description: 'GitHub token to authenticate API requests'
    required: true
    default: ${{ github.token }}

runs:
  using: 'node20'
  main: 'dist/index.js'

branding:
  icon: 'arrow-up'
  color: 'green'
